<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改任务</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        #map {
            height: 300px;
            width: 100%;
            margin-top: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mt-4 mb-4">修改任务</h1>
        
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">任务标题 *</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
            </div>
            <div class="form-group">
                <label for="description">任务描述 *</label>
                <textarea class="form-control" id="description" name="description" rows="4" required>{{ task.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="assignee">接收员工 *</label>
                <select class="form-control" id="assignee" name="assignee" required>
                    {% for employee in employees %}
                        <option value="{{ employee.id }}" {% if task.assignee.id == employee.id %}selected{% endif %}>{{ employee.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="deadline">截止日期 *</label>
                <input type="date" class="form-control" id="deadline" name="deadline" value="{{ task.deadline }}" required>
            </div>
            <div class="form-group">
                <label for="status">状态</label>
                <select class="form-control" id="status" name="status">
                    <option value="0" {% if task.status == 0 %}selected{% endif %}>待办</option>
                    <option value="1" {% if task.status == 1 %}selected{% endif %}>进行中</option>
                    <option value="2" {% if task.status == 2 %}selected{% endif %}>已完成</option>
                </select>
            </div>
            
            <!-- ArcGIS地图 -->
            <div id="map"></div>
            
            <button type="submit" class="btn btn-primary mt-4">提交</button>
            <a href="/task/" class="btn btn-secondary mt-4">取消</a>
        </form>
    </div>
    
    <!-- 引入ArcGIS JavaScript API -->
    <script src="https://js.arcgis.com/4.27/" defer></script>
    <script>
        require([
            "esri/Map",
            "esri/views/MapView",
            "esri/widgets/Search"
        ], function(Map, MapView, Search) {
            // 创建地图
            const map = new Map({
                basemap: "streets-navigation-vector"
            });
            
            // 创建地图视图
            const view = new MapView({
                container: "map",
                map: map,
                center: [116.3974, 39.9093], // 北京坐标
                zoom: 12
            });
            
            // 添加搜索控件
            const searchWidget = new Search({
                view: view
            });
            view.ui.add(searchWidget, { position: "top-right" });
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
